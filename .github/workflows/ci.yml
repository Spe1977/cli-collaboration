name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck on all *.sh
        # SC2254 is excluded: check-ownership.sh / legacy fixture compatibility.
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find . -type f -name '*.sh' -not -path './.git/*' | sort)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi
          printf 'Linting %d script(s):\n' "${#scripts[@]}"
          printf '  %s\n' "${scripts[@]}"
          shellcheck --exclude=SC2254 "${scripts[@]}"

  fixtures:
    name: fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show bash version
        run: bash --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: python3 -m pip install --upgrade pip pyyaml

      - name: Run mechanical eval checks (10 steps)
        # Mechanical guards only: parser fixtures, install/sync & rollback,
        # lang.sh tests, cross-CLI portability, hook-guard.py tests & templates,
        # lint-handoff unit tests, run-live-evals.py --self-test, frontmatter/
        # YAML/JSON validation, markdown link/+x integrity, and source-guard.
        run: bash evals/run-mechanical-checks.sh
